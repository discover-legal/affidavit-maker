# Render Blueprint for a production-equivalent staging environment.
services:
  - type: web
    name: affidavit-maker-staging
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    region: oregon
    branch: main
    preDeployCommand: node scripts/migrate.js
    healthCheckPath: /api/ready
    autoDeploy: false
    numInstances: 1
    maxShutdownDelaySeconds: 60
    disk:
      name: affidavit-staging-documents
      mountPath: /app/documents
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: '1'
      - key: REQUIRE_PERSISTENT_STORAGE
        value: 'true'
      - key: DATABASE_URL
        fromDatabase:
          name: affidavit-staging-db
          property: connectionString
      - key: DATABASE_CA_CERT
        sync: false
      - key: DATABASE_POOL_MAX
        value: '10'
      - key: DATABASE_STATEMENT_TIMEOUT_MS
        value: '30000'
      - key: TRUSTED_PROXY_HOPS
        value: '1'
      - key: API_MAX_BODY_BYTES
        value: '26214400'
      - key: AUTH0_SECRET
        sync: false
      - key: AUTH0_BASE_URL
        value: https://affidavit-maker-staging.onrender.com
      - key: AUTH0_ISSUER_BASE_URL
        sync: false
      - key: AUTH0_CLIENT_ID
        sync: false
      - key: AUTH0_CLIENT_SECRET
        sync: false
      - key: AUTH0_AUDIENCE
        sync: false
      - key: AUTH0_WEBHOOK_SECRET
        sync: false
      - key: AUTH0_COOKIE_SAME_SITE
        value: lax
      - key: AUTH0_COOKIE_SECURE
        value: 'true'
      - key: AUTH0_COOKIE_HTTP_ONLY
        value: 'true'
      - key: AUTH0_SESSION_ABSOLUTE_DURATION
        value: '86400'
      - key: AUTH0_SESSION_ROLLING_DURATION
        value: '3600'
      - key: NEXT_PUBLIC_AUTH0_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_AUTH0_CLIENT_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-5.5
      - key: OPENAI_MAX_TOKENS
        value: '2000'
      - key: OPENAI_TEMPERATURE
        value: '0.3'
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: PAYMENTS_MODE
        value: test
      - key: DOCUMENTS_PATH
        value: /app/documents
      - key: MAX_FILE_SIZE
        value: '10485760'
      - key: LOG_LEVEL
        value: debug
      - key: ENABLE_INTERNATIONAL
        value: 'false'
      - key: ENABLE_WEBHOOKS
        value: 'true'
      - key: ENABLE_ANALYTICS
        value: 'false'
      - key: MAINTENANCE_MODE
        value: 'false'
  - type: cron
    name: affidavit-staging-database-cleanup
    runtime: node
    plan: starter
    region: oregon
    branch: main
    schedule: "47 3 * * *"
    buildCommand: npm ci --omit=dev
    startCommand: node scripts/cleanDatabase.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: affidavit-staging-db
          property: connectionString
      - key: DATABASE_CA_CERT
        sync: false
      - key: CLEANUP_HEARTBEAT_URL
        sync: false

databases:
  - name: affidavit-staging-db
    plan: basic-256mb
    databaseName: affidavit_maker_staging
    user: affidavit_staging_user
    region: oregon
    storageAutoscalingEnabled: true
    ipAllowList: []
