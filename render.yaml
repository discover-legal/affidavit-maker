services:
  - type: web
    name: affidavit-maker
    env: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    region: oregon
    branch: main

    preDeployCommand: node scripts/migrate.js
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: 1

      # Database (auto-populated from Render PostgreSQL)
      - key: DATABASE_URL
        fromDatabase:
          name: affidavit-db
          property: connectionString
      - key: DATABASE_POOL_MAX
        value: 20

      # Auth0 — server side
      - key: AUTH0_SECRET
        sync: false           # 32-byte random hex; openssl rand -hex 32
      - key: AUTH0_BASE_URL
        value: https://discover.legal
      - key: AUTH0_ISSUER_BASE_URL
        sync: false           # https://your-tenant.auth0.com
      - key: AUTH0_CLIENT_ID
        sync: false
      - key: AUTH0_CLIENT_SECRET
        sync: false
      - key: AUTH0_AUDIENCE
        sync: false
      - key: AUTH0_WEBHOOK_SECRET
        sync: false

      # Auth0 — exposed to the client bundle
      - key: NEXT_PUBLIC_AUTH0_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_AUTH0_CLIENT_ID
        sync: false

      # OpenAI / LLM
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-4o-2024-08-06
      - key: OPENAI_MAX_TOKENS
        value: 2000
      - key: OPENAI_TEMPERATURE
        value: 0.3

      # Stripe
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false

      # File storage (PDFs, evidence)
      - key: DOCUMENTS_PATH
        value: /app/documents
      - key: MAX_FILE_SIZE
        value: 10485760

      # Feature flags
      - key: ENABLE_INTERNATIONAL
        value: false
      - key: ENABLE_WEBHOOKS
        value: true
      - key: ENABLE_ANALYTICS
        value: true
      - key: MAINTENANCE_MODE
        value: false

databases:
  - name: affidavit-db
    plan: free
    databaseName: affidavit_maker
    user: affidavit_user
    region: oregon

# NOTE: Persistent disks must be configured in the Render dashboard.
# Mount path /app/documents matches DOCUMENTS_PATH above.
