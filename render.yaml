services:
  # Web Service (Backend + Frontend)
  - type: web
    name: affidavit-maker
    env: docker
    plan: starter # or 'free' for testing
    dockerfilePath: ./Dockerfile
    region: oregon # Change to your preferred region
    branch: main # Change to your deployment branch

    # Run migrations before starting the server
    preDeployCommand: node scripts/migrate.js

    # Health check endpoint
    healthCheckPath: /health

    # Auto-deploy on git push
    autoDeploy: true

    # Environment variables
    envVars:
      # Server Configuration
      - key: NODE_ENV
        value: production

      - key: LOG_LEVEL
        value: info

      # Database (auto-populated from Render PostgreSQL)
      - key: DATABASE_URL
        fromDatabase:
          name: affidavit-db
          property: connectionString

      - key: DATABASE_POOL_MAX
        value: 20

      # Auth0 - YOU MUST SET THESE IN RENDER DASHBOARD
      - key: AUTH0_DOMAIN
        sync: false # Mark as secret, set manually

      - key: AUTH0_CLIENT_ID
        sync: false

      - key: AUTH0_CLIENT_SECRET
        sync: false

      - key: AUTH0_AUDIENCE
        sync: false

      # OpenAI - YOU MUST SET THESE IN RENDER DASHBOARD
      - key: OPENAI_API_KEY
        sync: false

      - key: OPENAI_MODEL
        value: gpt-4-turbo

      - key: OPENAI_MAX_TOKENS
        value: 2000

      - key: OPENAI_TEMPERATURE
        value: 0.3

      # Stripe - YOU MUST SET THESE IN RENDER DASHBOARD
      - key: STRIPE_SECRET_KEY
        sync: false

      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # Frontend URL (will be your Render URL)
      - key: FRONTEND_URL
        value: https://affidavit-maker.onrender.com # UPDATE THIS

      # Security
      - key: SESSION_SECRET
        generateValue: true # Render will auto-generate

      - key: BCRYPT_ROUNDS
        value: 10

      - key: JWT_EXPIRES_IN
        value: 24h

      - key: TRUSTED_PROXIES
        value: 1

      # Rate Limiting
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000

      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100

      - key: RATE_LIMIT_AUTH_ATTEMPTS
        value: 5

      # File Storage (ephemeral for MVP)
      - key: DOCUMENTS_PATH
        value: ./documents

      - key: MAX_FILE_SIZE
        value: 10485760

      # Feature Flags
      - key: ENABLE_WEBHOOKS
        value: true

      - key: ENABLE_EMAIL_NOTIFICATIONS
        value: false

      - key: ENABLE_ANALYTICS
        value: true

      - key: MAINTENANCE_MODE
        value: false

databases:
  # PostgreSQL Database
  - name: affidavit-db
    plan: free 
    databaseName: affidavit_maker
    user: affidavit_user
    region: oregon # Should match web service region
